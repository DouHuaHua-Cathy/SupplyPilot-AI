kind = "web"
previewPath = "/"
title = "SupplyPilot AI"
description = "A lightweight prototype for Malaysian small businesses to compare purchase orders with supplier messages and identify quantity or delivery discrepancies using transparent deterministic rules."
version = "1.0.0"
id = "artifacts/supplypilot-ai"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 20237

[services.development]
run = "pnpm --filter @workspace/supplypilot-ai run dev"

[services.production.build]
args = ["pnpm", "run", "build:supplypilot"]

[services.production.build.env]
NODE_ENV = "production"
PORT = "20237"
BASE_PATH = "/"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
NODE_ENV = "production"
SUPPLYPILOT_SERVE_WEB = "true"

[services.env]
PORT = "20237"
BASE_PATH = "/"
